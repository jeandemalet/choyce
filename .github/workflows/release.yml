name: Publier une version

# Pousser une étiquette v1.2.3 construit le programme Windows et publie la version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Vérifier que l'étiquette correspond à la version du programme
        shell: bash
        run: |
          version=$(python -c "import triphoto; print(triphoto.APP_VERSION)")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Tester
        run: python tests/test_triphoto.py
      - name: Construire
        run: >
          pyinstaller triphoto_qt.py --name Choyce --windowed --noconfirm
          --icon assets/triphoto.ico --add-data "assets;assets"
      # Le même programme sous son ancien nom : les copies installées avant Choyce se mettent à jour avec lui.
      - name: Empaqueter
        run: |
          Compress-Archive -Path dist/Choyce -DestinationPath Choyce-Windows.zip
          Copy-Item dist/Choyce dist/VisionBoard -Recurse
          Rename-Item dist/VisionBoard/Choyce.exe VisionBoard.exe
          Compress-Archive -Path dist/VisionBoard -DestinationPath VisionBoard-Windows.zip
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME Choyce-Windows.zip VisionBoard-Windows.zip --title "Choyce $env:GITHUB_REF_NAME" --generate-notes
